# nginx serves the built React SPA and reverse-proxies API calls to the
# FastAPI backend. Because the browser only ever talks to this one origin,
# there is no CORS and no hardcoded API host — calls use relative paths
# (/claims, /members, /eval, /health) and nginx forwards them to `api:8000`
# over the internal docker-compose network.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # No request-by-request access logging — the UI container shouldn't spam
    # stdout. Real errors still go to nginx's error_log (stderr).
    access_log off;

    # Forward API endpoints to the backend service.
    # NOTE: `eval/` carries the trailing slash on purpose — the API endpoint is
    # POST /eval/run, while the SPA has a client-side route at bare /eval. Only
    # /eval/... is proxied; /eval itself falls through to the SPA below.
    # Long timeouts: a single claim takes ~15-25s and the eval suite ~3 min.
    location ~ ^/(health|members|claims|eval/) {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
    }

    # SPA history fallback — every other path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
