services:
  - type: web
    name: plum-claims-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: DB_PATH
        value: /tmp/claims.db
      - key: POLICY_PATH
        value: data/policy_terms.json
      - key: TEST_CASES_PATH
        value: data/test_cases.json

  # React SPA as a static site. VITE_API_BASE_URL is baked in at build time and
  # points at the API's public URL (the browser calls it cross-origin; the API
  # allows this via CORS). Unlike docker, there's no reverse proxy here.
  - type: web
    name: plum-claims-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: plum-claims-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
